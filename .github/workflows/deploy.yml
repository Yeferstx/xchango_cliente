name: Publicar en GitHub Pages
on:
  push:
    branches:
      - release

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    name: Compilar
    runs-on: ubuntu-latest

    steps:
      - name: Bajar el repositorio
        uses: actions/checkout@v3

      - name: Instalar Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Compilar Angular
        run: npm run build -- --base-href=/xchango_cliente/

      - name: Copiar index.html como 404.html para que funcionen las rutas
        run: cp dist/xchango/browser/index.html dist/xchango/browser/404.html

      - name: Subir la pagina compilada
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist/xchango/browser

  deploy:
    name: Publicar
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Publicar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4