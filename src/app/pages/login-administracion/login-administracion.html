<div class="ad">
  <app-logo-xchango class="ad__marca" tamano="md" enlace="/login"></app-logo-xchango>

  <form class="ad__tarjeta" (ngSubmit)="enviar()">
    <span class="ad__etiqueta">
      <app-icon name="lock" [size]="13" />
      Acceso para el equipo
    </span>

    <h1 class="ad__titulo">Panel de administración</h1>
    <p class="ad__sub">Entra con tu correo y contraseña de administrador o moderador.</p>

    @if (error()) {
      <div class="ad__error" role="alert">
        <app-icon name="alert" [size]="16" />
        <span>{{ error() }}</span>
      </div>
    }

    <label class="ad__label" for="email">Correo</label>
    <div class="ad__caja" [class.ad__caja--error]="error()">
      <app-icon name="mail" [size]="17" />
      <input
        id="email"
        name="email"
        type="email"
        autocomplete="username"
        placeholder="correo@xchango.com"
        [ngModel]="email()"
        (ngModelChange)="email.set($event)"
        [disabled]="cargando()"
      />
    </div>

    <label class="ad__label" for="password">Contraseña</label>
    <div class="ad__caja" [class.ad__caja--error]="error()">
      <app-icon name="lock" [size]="17" />
      <input
        id="password"
        name="password"
        [type]="verPassword() ? 'text' : 'password'"
        autocomplete="current-password"
        placeholder="Tu contraseña"
        [ngModel]="password()"
        (ngModelChange)="password.set($event)"
        [disabled]="cargando()"
      />
      <button
        type="button"
        class="ad__ojo"
        (click)="verPassword.set(!verPassword())"
        [attr.aria-label]="verPassword() ? 'Ocultar contraseña' : 'Mostrar contraseña'"
      >
        <app-icon [name]="verPassword() ? 'eye-off' : 'eye'" [size]="17" />
      </button>
    </div>

    <button type="submit" class="ad__boton" [disabled]="cargando()">
      @if (cargando()) {
        <span class="ad__spinner"></span>
        Verificando...
      } @else {
        Iniciar sesión
      }
    </button>

    <p class="ad__pie">
      ¿Eres usuario de XchanGo? <a routerLink="/login">Volver al inicio</a>
    </p>
  </form>
</div>
