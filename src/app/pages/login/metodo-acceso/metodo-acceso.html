@if (abierto) {

  <!-- overlay -->

  <div
    class="ma-overlay"
    (click)="clicFondo($event)"
  >

    <!-- modal -->

    <div
      class="ma-modal"
      role="dialog"
      aria-modal="true" aria-labelledby="ma-titulo" tabindex="-1"
    >

      <!-- cerrar -->

      <button
        class="ma-close" data-foco-inicial
        type="button"
        aria-label="Cerrar"
        (click)="cerrarModal()"
      >

        <svg
          xmlns="http://www.w3.org/2000/svg"
          width="18"
          height="18"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <path d="M18 6 6 18"/>
          <path d="m6 6 12 12"/>
        </svg>

      </button>

      <!-- logo -->

      <div class="ma-logo"><app-logo-xchango tamano="md"></app-logo-xchango></div>

      <!-- títulos -->

      <h2 class="ma-titulo" id="ma-titulo">
        {{ titulo }}
      </h2>

      <p class="ma-subtitulo">
        {{ subtitulo }}
      </p>

      <!-- métodos -->

      <div class="ma-metodos">
        <!-- correo -->

        <button
          class="ma-metodo ma-metodo--correo"
          type="button"
          (click)="elegirCorreo()"
        >

          <span class="ma-metodo__icono">

            <svg
              xmlns="http://www.w3.org/2000/svg"
              width="18"
              height="18"
              viewBox="0 0 24 24"
              fill="none"
              stroke="#847A68"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <rect width="20" height="16" x="2" y="4" rx="2"/>
              <path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/>
            </svg>

          </span>

          <span class="ma-metodo__texto">
            Continuar con correo
          </span>

        </button>

      </div>

      <!-- cambio de modo -->

      <p class="ma-cambio-modo">

        {{ textoCambioModo }}

        <button
          type="button"
          class="ma-cambio-modo__accion"
          (click)="alternarModo()"
        >
          {{ accionCambioModo }}
        </button>

      </p>

    </div>

  </div>

}
