<div class="ac">

  <app-logo-xchango class="ac__marca" tamano="md" enlace="/login" *ngIf="!mostrarVerificacion()"></app-logo-xchango>

  <form class="ac__card" (ngSubmit)="entrar()" *ngIf="!mostrarVerificacion()">
    <a class="enlace-volver" routerLink="/login"><span aria-hidden="true">&#8592;</span> Volver al inicio</a>
    <h1 class="ac__title">Entrar a XchanGo</h1>
    <p class="ac__sub">Intercambia bienes y servicios en Casanare. Solo necesitas tu correo.</p>

    <label class="ac__label" for="ac-email">Correo</label>
    <input id="ac-email" class="ac__input" type="email" name="email"
      placeholder="tucorreo@mail.com" [(ngModel)]="email" required />

    <p class="ac__error" *ngIf="error()">{{ error() }}</p>

    <button class="ac__btn" type="submit">Continuar</button>

    <p class="ac__foot">
      ¿No tienes cuenta? <a routerLink="/formulario">Regístrate</a>
    </p>
  </form>

  <app-verificar-codigo
    *ngIf="mostrarVerificacion()"
    [correo]="email"
    (verificado)="codigoVerificado()"
    (volver)="volverAlCorreo()"
  ></app-verificar-codigo>

</div>
