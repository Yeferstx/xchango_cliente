@if (visible()) {
  <div class="cookies-fondo">

    <div class="cookies" role="dialog" aria-modal="true" aria-labelledby="cookies-titulo">

      <!-- galleta dibujada con mordisco y chispas de chocolate -->
      <span class="cookies__icono" aria-hidden="true">
        <svg xmlns="http://www.w3.org/2000/svg" width="72" height="72" viewBox="0 0 64 64">
          <defs>
            <mask id="mordisco">
              <rect width="64" height="64" fill="#fff"/>
              <circle cx="55" cy="13" r="8"/>
              <circle cx="59.5" cy="25" r="6"/>
              <circle cx="45" cy="5.5" r="6"/>
            </mask>
            <radialGradient id="masa" cx="42%" cy="42%" r="62%">
              <stop offset="0%" stop-color="#e6b06c"/>
              <stop offset="65%" stop-color="#cf904b"/>
              <stop offset="100%" stop-color="#ab6d33"/>
            </radialGradient>
            <radialGradient id="chispa" cx="35%" cy="30%" r="70%">
              <stop offset="0%" stop-color="#6e4428"/>
              <stop offset="100%" stop-color="#3f2414"/>
            </radialGradient>
          </defs>
          <g mask="url(#mordisco)">
            <circle cx="31" cy="34" r="27" fill="#9a5d2c"/>
            <circle cx="31" cy="33" r="25.5" fill="url(#masa)"/>
            <!-- borde de la mordida mas tostado -->
            <circle cx="55" cy="13" r="9" fill="none" stroke="#b97a3e" stroke-width="2"/>
            <circle cx="59.5" cy="25" r="7" fill="none" stroke="#b97a3e" stroke-width="2"/>
            <circle cx="45" cy="5.5" r="7" fill="none" stroke="#b97a3e" stroke-width="2"/>
            <path d="M13 24c4-7 10-11 17-11" stroke="#f3cd93" stroke-width="2.2" stroke-linecap="round" fill="none" opacity=".6"/>
            <path d="M14 32c3 1 5 0 7-2M34 48c2-2 5-2 7-1M27 17c2 1 3 3 3 5" stroke="#ab6d33" stroke-width="1.2" stroke-linecap="round" fill="none" opacity=".55"/>
            <circle cx="19" cy="21" r=".8" fill="#a0652f"/>
            <circle cx="28" cy="40" r=".7" fill="#a0652f"/>
            <circle cx="11" cy="42" r=".7" fill="#a0652f"/>
            <circle cx="43" cy="47" r=".8" fill="#a0652f"/>
          </g>
          <ellipse cx="21" cy="28" rx="3.6" ry="3" fill="url(#chispa)"/><ellipse cx="33" cy="22" rx="2.7" ry="2.3" fill="url(#chispa)"/><ellipse cx="38" cy="38" rx="3.8" ry="3.2" fill="url(#chispa)"/><ellipse cx="24" cy="44" rx="3" ry="2.6" fill="url(#chispa)"/><ellipse cx="14" cy="36" rx="2.2" ry="1.9" fill="url(#chispa)"/><ellipse cx="30" cy="32" rx="1.8" ry="1.5" fill="url(#chispa)"/><ellipse cx="44" cy="28" rx="2" ry="1.7" fill="url(#chispa)"/><ellipse cx="34" cy="50" rx="1.8" ry="1.5" fill="url(#chispa)"/><circle cx="20" cy="26.8" r=".9" fill="#b08560" opacity=".8"/><circle cx="37" cy="36.6" r="1" fill="#b08560" opacity=".8"/><circle cx="23.4" cy="42.8" r=".8" fill="#b08560" opacity=".8"/>
          <!-- migas que caen del mordisco -->
          <circle cx="50" cy="23" r="1.5" fill="#cf904b"/>
          <circle cx="54" cy="35" r="1.2" fill="#cf904b"/>
          <circle cx="58" cy="40" r=".9" fill="#b97a3e"/>
          <circle cx="40" cy="12" r="1" fill="#cf904b"/>
        </svg>
      </span>

      <h2 id="cookies-titulo" class="cookies__titulo">Usamos cookies</h2>

      <p class="cookies__texto">
        En XchanGo usamos cookies para mantener tu sesión iniciada y que la página
        funcione bien. Puedes aceptarlas o rechazarlas.
        <a routerLink="/legal-info">Ver términos y condiciones</a>
      </p>

      <div class="cookies__botones">
        <button type="button" class="cookies__boton cookies__boton--rechazar" (click)="rechazar()">
          Rechazar
        </button>
        <button type="button" class="cookies__boton cookies__boton--aceptar" (click)="aceptar()">
          Aceptar
        </button>
      </div>

    </div>

  </div>
}
